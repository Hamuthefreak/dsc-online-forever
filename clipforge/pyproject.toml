[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clipforge"
version = "0.1.0"
description = "One-command stream-VOD to platform-ready Shorts pipeline, with an MCP server wrapper."
requires-python = ">=3.10"
dependencies = [
  "yt-dlp>=2024.8.6",
  "faster-whisper>=1.0.3",
  "numpy>=1.24",
  "pillow>=10.0.0",
]

[project.optional-dependencies]
chat = ["chat-downloader>=0.2.6"]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0.0"]

[project.scripts]
clipforge = "clipforge.cli:main"

[tool.setuptools.packages.find]
include = ["clipforge*"]
